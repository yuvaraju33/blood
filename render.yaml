databases:
  - name: bloodlink-db
    databaseName: bloodlink
    user: bloodlink_user
    plan: free

services:
  - type: web
    name: blood-link
    runtime: node
    plan: free
    buildCommand: npm run render-build && npm run db:push
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bloodlink-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: PORT
        value: 10000
